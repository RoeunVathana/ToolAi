name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toypost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server/index.js

      - name: Check Phase 1 server syntax
        run: node --check server/phase1.js

      - name: Run full application checks
        run: npm run check

  deploy:
    name: Deploy to Railway
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || '297d4868-15b5-43cc-9a51-6b559bb1d3f6' }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID || '76aba715-5c7e-4612-95ae-004fecc4b8c0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Explain skipped deployment when the Railway token is missing
        if: env.RAILWAY_TOKEN == ''
        run: echo "::warning::Add RAILWAY_TOKEN in GitHub Actions secrets to enable deployment. RAILWAY_PROJECT_ID already has a production default."

      - name: Deploy service
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: railway up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_ID"
